<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Report | فلك القابضة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm monthly performance report for the CEO; findings first, no blame, numbers forward.
   IDEA: an editorial report deck; each finding is a slide card, like a designed monthly review.
   PICTURE: the cover slide in Falak blue with an oversized serif year, then KPI tiles with one solid blue anchor tile.
   COLOUR and TYPE: Falak blue dominant, warm paper cards, a single soft sky tint; Instrument Serif numerals, Alexandria text.
   LAYOUT: a vertical stack of 297x210 slides, cards in grids; the same slides print as the PDF pages. */
:root{color-scheme:light dark;
 --bg:light-dark(#e9ecf3,#060d22);--card:light-dark(#fbfaf7,#0f1a38);--tile:light-dark(#ffffff,#13214a);--ink:light-dark(#0f1a3a,#eef2fb);--mute:light-dark(#5b6683,#9fabcb);
 --line:light-dark(#e3e6ee,#22325e);--blue:#14306f;--blue2:light-dark(#14306f,#2a56c6);--sky:light-dark(#dfe8fb,#1a2b5a);--acc:light-dark(#2a56c6,#8fb0ff);--good:light-dark(#137a46,#6fd39d);--bad:light-dark(#b42318,#ff8f80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root.m-light{color-scheme:light!important}:root.m-dark{color-scheme:dark!important}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Alexandria,"Segoe UI",Tahoma,sans-serif;overflow-x:clip}
.num,.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-.01em}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1240px;margin:auto;display:flex;align-items:center;gap:12px;height:62px;padding:0 max(3vw,14px)}
.logo{height:28px;color:light-dark(#14306f,#ffffff);flex:none}
.nav{display:flex;gap:2px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
.nav a{flex:none;font-size:13px;color:var(--mute);text-decoration:none;padding:8px 10px;border-radius:8px}.nav a:hover{background:var(--card);color:var(--ink)}
.tg{display:flex;gap:6px;flex:none}
.tg button{height:40px;min-width:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px Alexandria,sans-serif;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(max-width:780px){.nav{display:none}}
main{max-width:1240px;margin:auto;padding:24px max(3vw,14px) 45vh;display:grid;gap:26px}
.slide{position:relative;background:var(--card);border-radius:22px;padding:clamp(22px,3.2vw,44px);box-shadow:0 1px 0 #fff4 inset,0 24px 50px -30px #0b1d4d55;min-height:min(640px,calc((100vw - 2*max(3vw,14px))*.6));display:flex;flex-direction:column}
.lbl{font-size:12px;color:var(--mute);margin:0 0 6px;display:flex;gap:8px;align-items:center}
.lbl b{color:var(--acc);font-weight:600}
h2{margin:0 0 6px;font-size:clamp(26px,3.4vw,42px);line-height:1.12;font-weight:600;text-wrap:balance}
[lang=en] h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(32px,4.2vw,52px);line-height:1.02}
.sub{color:var(--mute);margin:0 0 18px;max-width:80ch}
.foot{margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
/* cover */
.cover{background:radial-gradient(120% 90% at 100% 0%,#2147a8 0%,#14306f 45%,#0b1d4d 100%);color:#fff;overflow:hidden}
.cover .logo{height:40px;color:#fff}
.cover .kick{margin:auto 0 0;font-size:14px;opacity:.8}
.cover .big{font-size:clamp(70px,13vw,170px);line-height:.9;margin:6px 0 4px}
[lang=ar] .cover .big{font-family:Alexandria,sans-serif;font-weight:300;letter-spacing:0}[lang=ar] .cover .yr{margin-top:14px;font-family:Alexandria,sans-serif;font-style:normal;font-weight:300;font-size:clamp(28px,4.4vw,56px)}
.cover .yr{font-style:italic;opacity:.78;font-size:clamp(46px,8vw,110px);line-height:.9}
.cover h1{font-size:clamp(22px,2.6vw,32px);font-weight:600;margin:24px 0 8px;max-width:30ch}
.cover p{max-width:66ch;opacity:.85;margin:0}
.cover .rule{height:1px;background:#ffffff40;margin:26px 0 14px}
.cover .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;opacity:.85}
.cover .orb{position:absolute;inset-inline-end:-10%;top:-20%;width:60%;aspect-ratio:1;border-radius:50%;border:1px solid #ffffff22;pointer-events:none}
.cover .orb.b{inset-inline-end:-2%;top:-6%;width:38%}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.t{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:0 10px 24px -20px #0b1d4d66}
.t .cap{font-size:11px;color:var(--mute);margin:0 0 6px;line-height:1.4}
.t .num{font-size:clamp(40px,4.6vw,58px);line-height:1;color:var(--ink);display:block;direction:ltr;text-align:start}
[dir=rtl] .t .num{text-align:right}
.t .d{font-size:12px;color:var(--mute);margin-top:6px;display:block}
.t.solid{background:var(--blue2);border-color:transparent;color:#fff}.t.solid .num,.t.solid .cap,.t.solid .d{color:#fff}.t.solid .cap,.t.solid .d{opacity:.82}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.h3{font-size:13px;color:var(--mute);margin:18px 0 8px}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{display:block;text-decoration:none;color:inherit;background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:12px}
.mini b{display:block;font-size:13px;margin-bottom:4px}.mini span{font-size:11.5px;color:var(--mute);display:block;line-height:1.45}
.mini i{font-style:normal;font-size:11px;font-weight:600;color:var(--bad);display:block;margin-top:6px}
@media(max-width:980px){.minis{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.minis{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* tender slide */
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.box{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:16px}
.box h4{margin:0 0 8px;font-size:13px;color:var(--mute);font-weight:600}
.box p.n{font-size:12.5px;color:var(--mute);margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border:0}
td.w{text-align:end;white-space:nowrap;color:var(--acc);font-weight:600}
td.w .num{font-size:22px;color:var(--ink)}
.main{background:var(--blue2);color:#fff;border-radius:14px;padding:16px 18px;font-weight:600;font-size:15.5px;line-height:1.5}
.main small{display:block;font-weight:400;opacity:.75;font-size:11px;margin-bottom:4px}
.rs{display:grid;gap:10px;margin-top:10px}
.r{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.r b{display:block;font-size:14px;margin-bottom:2px}.r p{margin:0;font-size:13px;color:var(--mute)}
.meta2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin-bottom:14px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.win{margin-top:14px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:860px){.win{grid-template-columns:1fr}}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:4px 10px;align-items:center;font-size:12.5px}
.hb .bar{grid-column:1/-1;height:8px;border-radius:5px;background:var(--sky);overflow:hidden;margin-bottom:6px}.hb .bar i{display:block;height:100%;background:var(--blue2);border-radius:5px}
.hb .v{text-align:end;font-family:"Instrument Serif",serif;font-size:18px;direction:ltr}
.pass{display:flex;align-items:center;gap:12px}
.ring{--p:0;width:86px;height:86px;border-radius:50%;flex:none;background:conic-gradient(var(--blue2) calc(var(--p)*1%),var(--sky) 0);display:grid;place-items:center}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--tile);display:grid;place-items:center;font-family:"Instrument Serif",serif;font-size:24px}
.lesson{border-inline-start:4px solid var(--acc);padding:6px 12px;font-size:13.5px;font-weight:500;margin-top:12px}
/* matrix */
.mx{display:grid;grid-template-columns:minmax(160px,1.5fr) repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--tile)}
.mx div{padding:11px 8px;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;align-items:center;justify-content:center;text-align:center}
.mx .h{background:var(--sky);font-weight:600}.mx .rw{justify-content:flex-start;text-align:start;flex-direction:column;align-items:flex-start}
.mx .rw small{color:var(--mute);font-size:11px;font-weight:400}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--blue2)}.dot.s2{background:var(--blue2)}.dot.s1{background:linear-gradient(90deg,var(--blue2) 50%,transparent 50%)}.dot.s0{border-color:var(--line)}
@media(max-width:700px){.mx{grid-template-columns:minmax(100px,1.4fr) repeat(3,minmax(0,1fr))}.mx div{font-size:10px;padding:7px 3px}.mx .rw small{display:none}}
/* charts */
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
@media(max-width:860px){.charts{grid-template-columns:1fr}}
.cols{display:flex;align-items:flex-end;gap:12px;height:170px;padding:24px 4px 0;border-bottom:1px solid var(--line);position:relative}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.col i{display:block;width:70%;max-width:56px;border-radius:8px 8px 3px 3px;background:var(--blue2)}
.col i.lt{background:var(--sky)}.col i.neg{background:var(--bad);border-radius:3px 3px 8px 8px}
.col em{font-style:normal;font-family:"Instrument Serif",serif;font-size:20px;margin-bottom:4px;direction:ltr}
.xl{display:flex;gap:12px;padding:6px 4px 0}.xl span{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.base{position:absolute;inset-inline:0;border-top:1px dashed var(--mute);opacity:.6}
.base b{position:absolute;inset-inline-start:0;top:-16px;font-size:10px;font-weight:400;color:var(--mute)}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.opps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:860px){.opps{grid-template-columns:1fr}}
.op{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column}
.op .k{font-family:"Instrument Serif",serif;font-style:italic;color:var(--acc);font-size:15px}
.op b{font-size:15px;margin:4px 0 6px}.op p{margin:0 0 10px;font-size:13px;color:var(--mute)}
.op small{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--acc)}
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:860px){.plan{grid-template-columns:1fr}}
.plan .box ol{margin:0;padding-inline-start:18px}.plan li{font-size:13.5px;margin-bottom:8px}
.plan .box h4{color:var(--acc);font-size:15px}
.src{columns:2;column-gap:28px;font-size:12px;margin:0;padding-inline-start:18px}.src li{margin-bottom:6px;break-inside:avoid;overflow-wrap:anywhere}.src a{color:var(--acc)}
@media(max-width:760px){.src{columns:1}}
.note{font-size:12px;color:var(--mute);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:14px}
.means{background:var(--blue2);color:#fff;border-radius:14px;padding:16px 18px;font-size:14.5px;margin-top:14px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* print = PDF pages */
@media print{
 @page{size:297mm 210mm;margin:0}
 body{background:#fff;font-size:12.5px}.top{display:none}
 main{padding:0;gap:0;max-width:none;display:block}
 .slide{width:297mm;height:210mm;min-height:0;border-radius:0;box-shadow:none;padding:13mm 15mm 9mm;page-break-after:always;break-after:page;overflow:hidden;background:#fbfaf7}
 .cover{background:radial-gradient(120% 90% at 100% 0%,#2147a8 0%,#14306f 45%,#0b1d4d 100%)}
 h2{font-size:28px}[lang=en] h2{font-size:38px}
 .t .num{font-size:44px}.cols{height:130px}
 .tiles,.minis,.grid2,.win,.charts,.opps,.plan{gap:9px}
 .sub{margin-bottom:10px}.box,.t,.r,.op{padding:11px 12px}
 table{font-size:12px}td{padding:5px 4px}
 .hb{font-size:11px;gap:2px 8px}.hb .v{font-size:15px}.hb .bar{height:6px;margin-bottom:3px}.meta2{margin-bottom:8px}.win{margin-top:9px}.rs{gap:7px;margin-top:7px}.main{padding:11px 14px}.foot{padding-top:6px}
}

/* ---- v3 interactive ---- */
.prog{position:fixed;top:0;inset-inline-start:0;height:3px;background:var(--acc);z-index:20;width:0;transition:width .15s}
.pager{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:15;display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:99px;padding:5px;box-shadow:0 14px 30px -16px #0b1d4d88}
.pager button{width:44px;height:44px;border-radius:50%;border:0;background:var(--blue2);color:#fff;cursor:pointer;display:grid;place-items:center}
.pager button:disabled{opacity:.35;cursor:default}
[dir=rtl] .pager svg{transform:scaleX(-1)}
.pager span{font-size:13px;min-width:74px;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums}
.pager b{color:var(--ink)}
.cp{margin-inline-start:auto;border:1px solid var(--line);background:var(--tile);color:var(--mute);border-radius:8px;font:500 11px Alexandria,sans-serif;padding:5px 9px;cursor:pointer;min-height:30px}
.cp:hover{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 8px;align-items:center}
.chips .h3{margin:0 8px 0 0}
.fc{border:1px solid var(--line);background:var(--tile);color:var(--ink);border-radius:99px;padding:7px 14px;font:500 12.5px Alexandria,sans-serif;cursor:pointer;min-height:36px}
.fc[aria-pressed=true]{background:var(--blue2);color:#fff;border-color:transparent}
.mini{transition:opacity .2s,transform .2s}.mini.dim{opacity:.28}.mini:hover{transform:translateY(-3px)}
.tnav{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.tnav a{font-size:11.5px;text-decoration:none;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.tnav a.on{background:var(--blue2);color:#fff;border-color:transparent}
.r{cursor:pointer;transition:border-color .2s}.r:hover{border-color:var(--acc)}
.r p{display:none}.r.open p{display:block}.r b::after{content:"+";float:inline-end;color:var(--acc);font-weight:400}.r.open b::after{content:"−"}
.hb .bar i{transition:width 1s ease}
.hb span[title]{cursor:help}
.mx div.hl{background:color-mix(in srgb,var(--acc) 10%,var(--tile))}
.mx .rw{cursor:pointer}.mx.focus div:not(.h):not(.on){opacity:.3}
.ps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pc{all:unset;cursor:pointer;display:block;background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:132px;position:relative;transition:background .25s,border-color .25s}
.pc:focus-visible{outline:3px solid var(--acc)}
.pc .tg2{font-size:11px;font-weight:600;color:var(--bad)}
.pc .pr{display:block;font-weight:600;font-size:14.5px;margin:4px 0 8px}
.pc .so{display:none;font-size:13px;color:var(--ink)}
.pc .hint{font-size:11px;color:var(--acc)}
.pc.on{background:var(--sky);border-color:transparent}.pc.on .so{display:block}.pc.on .hint{display:none}.pc.on .tg2{color:var(--acc)}
.sys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;counter-reset:s}
.st{all:unset;cursor:pointer;display:block;background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:12px;position:relative}
.st:focus-visible{outline:3px solid var(--acc)}
.st .sn{font-family:"Instrument Serif",serif;font-size:30px;line-height:1;color:var(--acc)}
.st b{display:block;font-size:14.5px;margin-top:4px}.st small{display:block;font-size:11.5px;color:var(--mute)}
.st .sd{display:none}
.st.on{background:var(--blue2);color:#fff;border-color:transparent}.st.on .sn,.st.on small{color:#fff}
.sdet{margin-top:10px;background:var(--sky);border-radius:14px;padding:14px 16px;font-size:14px;min-height:56px}
@media(max-width:860px){.sys{grid-template-columns:1fr 1fr}}
.ck{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
@media(max-width:900px){.ck{grid-template-columns:1fr}}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.q:last-child{border:0}
.q label{font-size:13px}.q label small{color:var(--mute);margin-inline-start:6px}
.q .crit{color:var(--bad);font-size:10.5px;font-weight:600;margin-inline-start:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--tile);color:var(--mute);font:500 12px Alexandria,sans-serif;padding:0 10px;min-height:36px;cursor:pointer;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed=true]{background:var(--blue2);color:#fff}
@media(max-width:560px){.q{grid-template-columns:1fr}}
.res{display:flex;flex-direction:column;gap:10px}
.gauge{--p:0;width:150px;height:150px;border-radius:50%;margin:4px auto 0;background:conic-gradient(var(--gc,var(--blue2)) calc(var(--p)*1%),var(--sky) 0);display:grid;place-items:center;transition:--p .4s}
.gauge span{width:118px;height:118px;border-radius:50%;background:var(--tile);display:grid;place-items:center;text-align:center}
.gauge b{font-family:"Instrument Serif",serif;font-size:46px;font-weight:400;line-height:1}
.verdict{text-align:center;font-weight:600;font-size:15px}
.gaps{margin:0;padding-inline-start:18px;font-size:12.5px;color:var(--mute)}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:var(--tile);color:var(--ink);border-radius:10px;padding:8px 12px;font:500 12.5px Alexandria,sans-serif;cursor:pointer;min-height:40px}
.btn.pri{background:var(--blue2);color:#fff;border-color:transparent}
.plan li{list-style:none;margin-inline-start:-18px}
.plan label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.plan input{width:18px;height:18px;margin-top:3px;accent-color:#2a56c6;flex:none}
.plan input:checked+span{text-decoration:line-through;color:var(--mute)}
.pbar{height:6px;border-radius:4px;background:var(--sky);margin:-2px 0 12px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--blue2);width:0;transition:width .3s}
.col i{transition:height .9s ease}.col{cursor:default}.col:hover em{color:var(--acc)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media print{.prog,.pager,.cp,.chips .fc,.tnav,.btns,.toast,.hint{display:none!important}.r p,.pc .so,.st .sd{display:block!important}.r b::after{content:""}.pc{min-height:0}.sdet{display:none}.mini.dim{opacity:1}.st{background:var(--tile)!important;color:var(--ink)!important}.st .sn{color:var(--acc)!important}.st small{color:var(--mute)!important}.st .sd{font-size:11px;margin-top:6px}}
@media(prefers-reduced-motion:reduce){.col i,.hb .bar i,.prog{transition:none}}

/* ---- v4 aligned dashboards ---- */
.tiles.t4{margin-bottom:12px}
.t.sm{padding:12px 14px}.t.sm .v{display:block;font-size:17px;font-weight:600;line-height:1.3}.t.sm.solid .v{color:#fff}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}
.g3>.box,.g2w>.box,.g2e>.box,.gpat>.box{height:100%;display:flex;flex-direction:column}
@media(max-width:980px){.g3{grid-template-columns:1fr}}
.nt{font-size:12px;color:var(--mute);margin:0 0 10px}
.hbars{display:grid;gap:10px}
.hr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:baseline}
.hr .l{font-size:12.5px;display:flex;align-items:center;gap:6px}.hr .n{font-family:"Instrument Serif",serif;font-size:19px;direction:ltr}
.hr .tr{grid-column:1/-1;height:9px;border-radius:5px;background:var(--sky);overflow:hidden}.hr .tr i{display:block;height:100%;border-radius:5px;background:var(--blue2);transition:width 1s ease}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.chk li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;font-size:12.5px;padding:8px;border-radius:10px;background:var(--bg)}
.chk li em{grid-column:2;font-style:normal;font-size:10.5px;font-weight:600;color:#fff;background:var(--blue2);border-radius:99px;padding:1px 8px;justify-self:start}
.chk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:var(--acc);font-size:12px;font-weight:700}
.chk li.key{background:var(--sky);outline:1.5px solid var(--blue2)}.chk li.key .ic{background:var(--blue2);color:#fff}
.box .main{font-size:14px;padding:12px 14px;margin-bottom:10px}
.r2{border-top:1px solid var(--line);padding:8px 0 0;margin-top:8px}.r2 b{font-size:13.5px;display:block}.r2 p{margin:2px 0 0;font-size:12.5px;color:var(--mute)}
.fixb .pf{border-radius:12px;padding:10px 12px;background:var(--bg);margin-bottom:8px}
.fixb .pf p{margin:4px 0 0;font-size:13px}
.fixb .so2{background:var(--sky)}
.tg2{font-size:11px;font-weight:600;color:var(--acc)}
.fixb .pf:first-of-type .tg2{color:var(--bad)}
.fixb .lesson{margin-top:auto}
.g2w{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:stretch}
@media(max-width:860px){.g2w{grid-template-columns:1fr}}
.ctr{align-items:center;justify-content:center}
.strip{margin:12px 0 0;padding:10px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--tile)}
.h2s{font-size:clamp(24px,2.8vw,34px)}[lang=en] .h2s{font-size:clamp(28px,3.4vw,42px)}
.minis{grid-auto-rows:1fr}.mini{height:100%;display:flex;flex-direction:column}.mini i{margin-top:auto;padding-top:6px}
.gpat{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;align-items:stretch}
@media(max-width:980px){.gpat{grid-template-columns:1fr}}
.pst{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--tile)}
.psh,.psr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.psh span{padding:10px 16px;font-size:12px;font-weight:600;color:var(--mute);background:var(--sky)}
.psr{border-top:1px solid var(--line)}
.psr .pp{padding:11px 16px;display:flex;flex-direction:column;gap:2px}.psr .pp b{font-size:14px}.psr .pp .tg2{color:var(--bad)}
.psr .ss{padding:11px 16px;font-size:13px;background:color-mix(in srgb,var(--sky) 55%,transparent);border-inline-start:3px solid var(--blue2);display:flex;align-items:center}
@media(max-width:700px){.psh{display:none}.psr{grid-template-columns:1fr}}
.exp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;grid-auto-rows:1fr}
.ex{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;transition:opacity .2s}
.ex.dim{opacity:.25}.sumc{background:var(--sky);gap:10px}.sumc>b{font-size:14.5px}@media(max-width:1000px){.exp{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.exp{grid-template-columns:1fr}}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}.exh b{font-size:14.5px;line-height:1.4}
.pri{flex:none;font-size:11px;font-weight:600;border-radius:99px;padding:2px 10px}.pri.p0{background:var(--blue2);color:#fff}.pri.p1{background:var(--sky);color:var(--acc)}.pri.p2{border:1px solid var(--line);color:var(--mute)}
.ex dl{margin:0;display:grid;gap:2px}.ex dt{font-size:10.5px;color:var(--mute);margin-top:6px}.ex dd{margin:0;font-size:12.5px}
.g2e{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:stretch}
@media(max-width:900px){.g2e{grid-template-columns:1fr}}
.mat{position:relative;height:290px;border-inline-start:1.5px solid var(--line);border-bottom:1.5px solid var(--line);margin:6px 4px 26px;background:linear-gradient(to top right,transparent 50%,color-mix(in srgb,var(--sky) 70%,transparent) 50%)}
[dir=rtl] .mat{background:linear-gradient(to top left,transparent 50%,color-mix(in srgb,var(--sky) 70%,transparent) 50%)}
.ax{position:absolute;font-size:11px;color:var(--mute)}.a1{top:4px;inset-inline-start:6px}.a2{bottom:4px;inset-inline-start:6px}.a3{bottom:-20px;inset-inline-start:0}.a4{bottom:-20px;inset-inline-end:0}.a5{top:6px;inset-inline-end:8px;font-weight:600;color:var(--acc)}
.pt{position:absolute;width:34px;height:34px;margin:0 0 -17px;transform:translateX(-50%);border-radius:50%;border:2px solid var(--card);font:600 13px Alexandria,sans-serif;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 14px -6px #0b1d4d88;transition:transform .15s}
[dir=rtl] .pt{transform:translateX(50%)}
.pt.p0{background:var(--blue2);color:#fff}.pt.p1{background:var(--acc);color:#fff;opacity:.75}.pt.p2{background:var(--sky);color:var(--acc)}
.pt:hover,.pt.on{outline:3px solid var(--acc);outline-offset:2px}
.mdet{margin-top:auto;background:var(--sky);border-radius:12px;padding:10px 12px;font-size:12.5px;display:grid;gap:2px}.mdet .mm{color:var(--mute);font-size:11.5px}
.stack{display:flex;height:26px;border-radius:8px;overflow:hidden;gap:2px}.stack i{background:var(--blue2)}
.sw{width:10px;height:10px;border-radius:3px;background:var(--blue2);display:inline-block;flex:none}
.legend{margin-top:auto;padding-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:11px;color:var(--mute)}.legend b{color:var(--acc)}
@media print{.g3,.g2w,.g2e,.gpat,.tiles.t4{gap:8px}.t.sm{padding:8px 10px}.t.sm .v{font-size:14px}.box .main{font-size:12.5px;padding:8px 10px;margin-bottom:6px}.r2{padding-top:5px;margin-top:5px}.r2 p,.fixb .pf p,.chk li,.nt{font-size:11px}.r2 b{font-size:12px}.fixb .pf{padding:7px 9px;margin-bottom:6px}.hr .n{font-size:15px}.hbars{gap:6px}.chk{gap:5px}.chk li{padding:5px 7px}.h2s{font-size:22px}[lang=en] .h2s{font-size:28px}.meta2{font-size:10.5px}.tnav,.chips .ef{display:none}.mat{height:230px}.strip{margin-top:8px;padding:7px 10px}.g2w{margin-top:8px}.ex dd{font-size:11px}.ex{padding:10px}.exp{gap:8px}.psr .pp,.psr .ss{padding:7px 12px}.psr .ss{font-size:11.5px}.psr .pp b{font-size:12.5px}.mdet{font-size:11px}.lesson{font-size:12px;margin-top:6px}.mx div{padding:6px 6px;font-size:11px}.mx .rw small{font-size:9.5px;line-height:1.35}.chk li{padding:4px 6px;gap:6px}.chk .ic{width:18px;height:18px;font-size:10px}.r2 p{line-height:1.45}.fixb .pf p{line-height:1.45}.sub{font-size:12px}.meta2{margin-bottom:6px;gap:2px 10px}.lbl{margin-bottom:2px}.foot{padding-top:4px}.slide{padding:11mm 14mm 7mm}.tiles.t4{margin-bottom:8px}}
</style>

 return `<section class="slide" id="macro">${lbl('macro',u.mkt,' · 1')}<h2>${esc(m.t1)}</h2><p class="sub">${esc(m.s1)}</p><div class="tiles">${m.tiles1.map((t,i)=>tile(t,i==0)).join('')}</div><div class="charts"><div class="box"><h4>${u.gdp}</h4>${gm}</div><div class="box"><h4>${u.pmi}</h4>${pmc}</div></div>${foot()}</section>`}

 return `<section class="slide" id="finance">${lbl('finance',u.mkt,' · 2')}<h2>${esc(m.t2)}</h2><div class="tiles" style="margin-top:8px">${m.tiles2.map((t,i)=>tile(t,i==0)).join('')}</div><div class="charts"><div class="box"><h4>${esc(m.awards_t)}</h4><div class="cols">${m.awards.map((a,i)=>`<div class="col"><em>${a[1]}</em><i class="${i?'':'lt'}" data-h="${a[1]/mx*92}" title="${esc(a[0])}: $${a[1]}bn" style="height:${PRINT?a[1]/mx*92:0}%"></i></div>`).join('')}</div><div class="xl">${m.awards.map(a=>`<span>${esc(a[0])}</span>`).join('')}</div></div><div class="box"><h4>${u.shift}</h4><ul class="list">${m.shift.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div></div>${foot()}</section>`}
function riyadh(){const u=U[L],m=D.mkt[L];return `<section class="slide" id="riyadh">${lbl('riyadh',u.mkt,' · 3')}<h2>${esc(m.t3)}</h2><p class="sub">${esc(m.s3)}</p><div class="tiles">${m.tiles3.map((t,i)=>tile(t,i==0)).join('')}</div><div class="box" style="margin-top:14px"><h4>${esc(m.events_t)}</h4><ul class="list" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${m.events.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>${foot()}</section>`}
function consult(){const u=U[L],m=D.mkt[L];return `<section class="slide" id="consult">${lbl('consult',u.mkt,' · 4')}<h2>${esc(m.t4)}</h2><div class="tiles" style="margin-top:8px">${m.tiles4.map((t,i)=>tile(t,i==3)).join('')}</div><div class="means">${u.means}</div>${foot()}</section>`}
function opps(){const u=U[L],E=D.exp;return `<section class="slide" id="expansion">${lbl('expansion',u.expL)}<h2>${u.expT}</h2><p class="sub">${u.expS}</p><div class="chips" style="margin-top:0"><button type="button" class="fc ef" data-p="-1" aria-pressed="true">${u.allP}</button>${E.pri[L].map((x,i)=>`<button type="button" class="fc ef" data-p="${i}" aria-pressed="false">${x}</button>`).join('')}</div>
 <div class="exp">${E.lines.map(x=>`<div class="ex" data-p="${x.pr}"><div class="exh"><b>${esc(x[L][0])}</b><span class="pri p${x.pr}">${E.pri[L][x.pr]}</span></div><dl><dt>${u.why}</dt><dd>${esc(x[L][1])}</dd><dt>${u.need}</dt><dd>${esc(x[L][2])}</dd><dt>${u.when}</dt><dd>${esc(x[L][3])}</dd></dl></div>`).join('')}<div class="ex sumc"><b>${L=='ar'?'ملخص الأولويات':'Priority summary'}</b>${E.pri[L].map((x,i)=>{const n=E.lines.filter(l=>l.pr==i).length;return `<div class="hr"><span class="l"><span class="pri p${i}">${x}</span></span><span class="n">${n}</span><div class="tr"><i data-w="${n/3*100}" style="width:${PRINT?n/3*100:0}%"></i></div></div>`}).join('')}<p class="nt" style="margin:auto 0 0">${L=='ar'?'ثلاثة خطوط تبدأ خلال 3 أشهر، وكلها مبنية على قدرات فلك الحالية مع شريك.':'Three lines start within 3 months, all built on current Falak capabilities plus a partner.'}</p></div></div>${foot()}</section>
 <section class="slide" id="growth">${lbl('growth',u.dashL)}<h2>${u.dashT}</h2><p class="sub">${u.dashS}</p><div class="g2e"><div class="box"><h4>${u.imp} / ${u.rdy}</h4><div class="mat" id="mat"><span class="ax a1">${L=='ar'?'أثر عالٍ':'High impact'}</span><span class="ax a2">${L=='ar'?'أثر منخفض':'Low impact'}</span><span class="ax a3">${L=='ar'?'جاهزية منخفضة':'Low readiness'}</span><span class="ax a4">${L=='ar'?'جاهزية عالية':'High readiness'}</span><span class="ax a5">${L=='ar'?'ابدأ هنا':'Start here'}</span><div class="q q1"></div>${E.lines.map((x,i)=>{const dup=E.lines.slice(0,i).filter(y=>y.imp==x.imp&&y.rdy==x.rdy).length;return `<button type="button" class="pt p${x.pr}" data-i="${i}" style="inset-inline-start:${(x.rdy-1)/4*80+8+dup*9}%;bottom:${(x.imp-1)/4*78+8}%;" aria-label="${esc(x[L][0])}">${i+1}</button>`}).join('')}</div><div class="mdet" id="mdet"><b>1 · ${esc(E.lines[0][L][0])}</b><span>${esc(E.lines[0][L][1])}</span></div></div>
 <div class="box"><h4>${u.mixT}</h4><div class="stack">${E.mix.map((m,i)=>`<i style="flex:${m[2]};opacity:${1-i*.15}" title="${esc(m[L=='ar'?0:1])}: ${m[2]}%"></i>`).join('')}</div><div class="hbars" style="margin-top:12px">${E.mix.map((m,i)=>`<div class="hr"><span class="l"><span class="sw" style="opacity:${1-i*.15}"></span>${esc(m[L=='ar'?0:1])}</span><span class="n">${m[2]}%</span></div>`).join('')}</div><div class="legend">${E.lines.map((x,i)=>`<span><b>${i+1}</b> ${esc(x[L][0])}</span>`).join('')}</div></div></div>${foot()}</section>`}
let PL=null;
function plan(){const u=U[L];PL=PL||store.get('bd-plan',{});return `<section class="slide" id="plan">${lbl('plan',u.plan)}<h2>${u.planT}</h2><div class="plan" style="margin-top:10px">${D.plan[L].map((c,ci)=>`<div class="box"><h4>${esc(c[0])} <small class="pcnt" data-c="${ci}" style="color:var(--mute);font-weight:400"></small></h4><div class="pbar"><i data-c="${ci}"></i></div><ol>${c[1].map((x,xi)=>`<li><label><input type="checkbox" data-k="${ci}-${xi}" ${PL[ci+'-'+xi]?'checked':''}><span>${esc(x)}</span></label></li>`).join('')}</ol></div>`).join('')}</div>${foot()}</section>`}
function planProg(){D.plan[L].forEach((c,ci)=>{const n=c[1].length,d=c[1].filter((x,xi)=>PL[ci+'-'+xi]).length;const b=document.querySelector(`.pbar i[data-c="${ci}"]`);if(b)b.style.width=(d/n*100)+'%';const t=document.querySelector(`.pcnt[data-c="${ci}"]`);if(t)t.textContent=`${d}/${n} ${U[L].done}`})}
function sources(){const u=U[L];return `<section class="slide" id="sources">${lbl('sources',u.src)}<h2>${u.srcT}</h2><ol class="src" style="margin-top:10px">${D.sources.map(s=>`<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join('')}</ol><p class="note">${esc(D.meta[L].note)}</p>${foot()}</section>`}
/* count-up + bars on view */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el){const raw=el.dataset.n;const m=raw.match(/[\d,]+(\.\d+)?/);if(!m||RM||PRINT)return;const target=parseFloat(m[0].replace(/,/g,''));const dec=(m[1]||'').length?m[1].length-1:0;const comma=m[0].includes(',');const pre=raw.slice(0,m.index),post=raw.slice(m.index+m[0].length);const t0=performance.now(),dur=900;
 const f=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);let v=(target*e).toFixed(dec);if(comma)v=Number(v).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});el.textContent=pre+v+post;if(k<1)requestAnimationFrame(f);else el.textContent=raw};requestAnimationFrame(f)}
let io;
function observe(){if(io)io.disconnect();io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const s=e.target;if(s.dataset.seen)return;s.dataset.seen=1;s.querySelectorAll('.num[data-n]').forEach(countUp);s.querySelectorAll('[data-h]').forEach(i=>i.style.height=i.dataset.h+'%');s.querySelectorAll('[data-w]').forEach(i=>i.style.width=i.dataset.w+'%')})},{threshold:.25});document.querySelectorAll('.slide').forEach(s=>io.observe(s))}
/* pager */
let slides=[],cur=0;
function updPager(){slides=[...document.querySelectorAll('.slide')];const mid=innerHeight*.4;let c=0;slides.forEach((s,i)=>{if(s.getBoundingClientRect().top<=mid)c=i});cur=c;$('pc').innerHTML=`<b>${String(c+1).padStart(2,'0')}</b> / ${String(slides.length).padStart(2,'0')}`;$('pv').disabled=c==0;$('nx').disabled=c==slides.length-1;const h=document.documentElement;$('prog').style.width=(scrollY/Math.max(1,h.scrollHeight-innerHeight)*100)+'%'}
const go=d=>{const i=Math.max(0,Math.min(slides.length-1,cur+d));slides[i].scrollIntoView({behavior:RM?'auto':'smooth'})};
$('pv').addEventListener('click',()=>go(-1));$('nx').addEventListener('click',()=>go(1));
addEventListener('scroll',updPager,{passive:true});addEventListener('resize',updPager);
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key=='PageDown'||e.key=='j'){e.preventDefault();go(1)}else if(e.key=='PageUp'||e.key=='k'){e.preventDefault();go(-1)}else if(e.key=='ArrowLeft'||e.key=='ArrowRight'){if(e.target.closest('.seg'))return;e.preventDefault();const fwd=(e.key=='ArrowLeft')==(L=='ar');go(fwd?1:-1)}});
/* delegated events */
document.getElementById('deck').addEventListener('click',e=>{
 const cp=e.target.closest('.cp');if(cp){const url=location.href.split('#')[0]+'#'+cp.dataset.link;try{navigator.clipboard.writeText(url).then(()=>toast(U[L].copied),()=>toast(url))}catch(x){toast(url)}return}
 const ef=e.target.closest('.ef');if(ef){document.querySelectorAll('.ef').forEach(b=>b.setAttribute('aria-pressed',String(b==ef)));const p=ef.dataset.p;document.querySelectorAll('.ex:not(.sumc)').forEach(x=>x.classList.toggle('dim',p!='-1'&&x.dataset.p!=p));return}
 const pt=e.target.closest('.pt');if(pt){const x=D.exp.lines[+pt.dataset.i];document.querySelectorAll('.pt').forEach(b=>b.classList.toggle('on',b==pt));$('mdet').innerHTML=`<b>${+pt.dataset.i+1} · ${esc(x[L][0])}</b><span>${esc(x[L][1])}</span><span class="mm">${U[L].need}: ${esc(x[L][2])} · ${U[L].when}: ${esc(x[L][3])}</span>`;return}
 const fc=e.target.closest('.fc:not(.ef)');if(fc){document.querySelectorAll('.fc:not(.ef)').forEach(b=>b.setAttribute('aria-pressed',String(b==fc)));const f=fc.dataset.f;document.querySelectorAll('.mini').forEach(m=>m.classList.toggle('dim',f!='all'&&m.dataset.k!=f));return}
 const r=e.target.closest('.r');if(r){r.classList.toggle('open');r.setAttribute('aria-expanded',r.classList.contains('open'));return}
 const rw=e.target.closest('.rw');if(rw){const mx=$('mx'),i=rw.dataset.r,on=mx.dataset.f==i;mx.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));if(on){mx.classList.remove('focus');delete mx.dataset.f}else{mx.classList.add('focus');mx.dataset.f=i;mx.querySelectorAll(`[data-r="${i}"]`).forEach(x=>x.classList.add('on'))}return}
 const pc=e.target.closest('.pc');if(pc){pc.classList.toggle('on');pc.setAttribute('aria-pressed',pc.classList.contains('on'));return}
 if(e.target.closest('#psall')){const cards=[...document.querySelectorAll('.pc')];const open=!cards.every(c=>c.classList.contains('on'));cards.forEach(c=>{c.classList.toggle('on',open);c.setAttribute('aria-pressed',open)});$('psall').textContent=open?U[L].hideAll:U[L].showAll;return}
 const st=e.target.closest('.st');if(st){document.querySelectorAll('.st').forEach(b=>{b.classList.toggle('on',b==st);b.setAttribute('aria-pressed',String(b==st))});$('sdet').textContent=D.system[L][+st.dataset.i][2];return}
 const sb=e.target.closest('.seg button');if(sb){CK[+sb.dataset.q]=+sb.dataset.v;score();return}
 if(e.target.closest('#ckex')){CK=D.check.example.slice();score();return}
 if(e.target.closest('#ckre')){CK=D.check.items.map(()=>0);score();return}
 if(e.target.closest('#ckcp')){const sc=score();const txt=`${U[L].ckT}\n${sc}/100 · ${$('verdict').textContent}\n${U[L].gaps}:\n`+[...document.querySelectorAll('#gaps li')].map(l=>'• '+l.textContent).join('\n');try{navigator.clipboard.writeText(txt).then(()=>toast(U[L].copied),()=>toast(sc+'/100'))}catch(x){toast(sc+'/100')}return}
});
document.getElementById('deck').addEventListener('change',e=>{const c=e.target.closest('input[type=checkbox][data-k]');if(c){PL[c.dataset.k]=c.checked;store.set('bd-plan',PL);planProg()}});
document.getElementById('deck').addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.matches('.r,.rw')){e.preventDefault();e.target.click()}});
document.getElementById('deck').addEventListener('mouseover',e=>{const c=e.target.closest('.mx [data-c]');document.querySelectorAll('.mx .hl').forEach(x=>x.classList.remove('hl'));if(!c)return;const mx=$('mx');mx.querySelectorAll(`[data-c="${c.dataset.c}"]`).forEach(x=>x.classList.add('hl'));if(c.dataset.r)mx.querySelectorAll(`[data-r="${c.dataset.r}"]`).forEach(x=>x.classList.add('hl'))});
function render(){pg=0;const de=document.documentElement;de.lang=L;de.dir=L=='ar'?'rtl':'ltr';document.title=L=='ar'?'BD Report | فلك القابضة':'BD Report | Falak Holding';
 $('lang').textContent=U[L].lang;
 $('nav').innerHTML=U[L].nav.map(n=>`<a href="#${n[0]}">${n[1]}</a>`).join('');
 $('deck').innerHTML=cover()+glance()+D.projects.map(tender).join('')+patterns()+problems()+system()+checker()+macro()+finance()+riyadh()+consult()+opps()+plan()+sources();
 score();planProg();observe();updPager();
 if(location.hash){const el=$(location.hash.slice(1));if(el)el.scrollIntoView()}}
$('lang').addEventListener('click',()=>{const id=slides[cur]&&slides[cur].id;L=L=='ar'?'en':'ar';try{localStorage.setItem('bd-lang',L)}catch(e){}render();const el=id&&$(id);if(el)el.scrollIntoView()});
const isDark=()=>{const r=document.documentElement;if(r.classList.contains('m-light'))return false;if(r.classList.contains('m-dark'))return true;if(r.dataset.theme)return r.dataset.theme=='dark';return matchMedia('(prefers-color-scheme: dark)').matches};
const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>';
function setMode(m){const r=document.documentElement;r.classList.remove('m-light','m-dark');if(m)r.classList.add('m-'+m);const d=isDark();$('theme').innerHTML=d?SUN:MOON;$('theme').setAttribute('aria-label',d?(L=='ar'?'الوضع النهاري':'Light mode'):(L=='ar'?'الوضع الليلي':'Dark mode'))}
$('theme').addEventListener('click',()=>{const m=isDark()?'light':'dark';setMode(m);try{localStorage.setItem('bd-mode',m)}catch(e){}});
try{setMode(localStorage.getItem('bd-mode'))}catch(e){setMode(null)}
new MutationObserver(()=>setMode([...document.documentElement.classList].find(c=>c.startsWith('m-'))?.slice(2)||null)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
addEventListener('hashchange',()=>{const el=$(location.hash.slice(1));if(el)el.scrollIntoView()});
render();
}
</script>
</body>
</html>
