/* VOICE: a calm monthly performance report for the CEO; findings first, no blame, numbers forward.
   IDEA: an editorial report deck; each finding is a slide card, like a designed monthly review.
   PICTURE: the cover slide in Falak blue with an oversized serif year, then KPI tiles with one solid blue anchor tile.
   COLOUR and TYPE: Falak blue dominant, warm paper cards, a single soft sky tint; Instrument Serif numerals, Alexandria text.
   LAYOUT: a vertical stack of 297x210 slides, cards in grids; the same slides print as the PDF pages. */
:root{color-scheme:light dark;
 --bg:light-dark(#efefef,#010126);--card:light-dark(#ffffff,#070b3d);--tile:light-dark(#ffffff,#0c1252);--ink:light-dark(#010126,#efefef);--mute:light-dark(#555b78,#a3abcf);
 --line:light-dark(#e2e4ec,#1d2a6e);--blue:#002aad;--blue2:light-dark(#002aad,#009eff);--sky:light-dark(#e2edff,#0d1a5c);--acc:light-dark(#009eff,#00e8fc);--good:light-dark(#137a46,#6fd39d);--bad:light-dark(#b42318,#ff8f80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root.m-light{color-scheme:light!important}:root.m-dark{color-scheme:dark!important}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "FalakLatin",Alexandria,"Segoe UI",Tahoma,sans-serif;overflow-x:clip}
.num,.serif{font-family:"FalakLatin",Alexandria,sans-serif;font-weight:400;letter-spacing:-.01em}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1240px;margin:auto;display:flex;align-items:center;gap:12px;height:62px;padding:0 max(3vw,14px)}
.logo{height:28px;color:light-dark(#002aad,#ffffff);flex:none}
.nav{display:flex;gap:2px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
.nav a{flex:none;font-size:13px;color:var(--mute);text-decoration:none;padding:8px 10px;border-radius:8px}.nav a:hover{background:var(--card);color:var(--ink)}
.tg{display:flex;gap:6px;flex:none}
.tg button{height:40px;min-width:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px "FalakLatin",Alexandria,sans-serif;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(max-width:780px){.nav{display:none}}
main{max-width:1240px;margin:auto;padding:24px max(3vw,14px) 45vh;display:grid;gap:26px}
.slide{position:relative;background:var(--card);border-radius:22px;padding:clamp(22px,3.2vw,44px);box-shadow:0 1px 0 #fff4 inset,0 24px 50px -30px #01012655;min-height:min(640px,calc((100vw - 2*max(3vw,14px))*.6));display:flex;flex-direction:column}
.lbl{font-size:12px;color:var(--mute);margin:0 0 6px;display:flex;gap:8px;align-items:center}
.lbl b{color:var(--acc);font-weight:600}
h2{margin:0 0 6px;font-size:clamp(26px,3.4vw,42px);line-height:1.12;font-weight:600;text-wrap:balance}
[lang=en] h2{font-family:"FalakLatin",Alexandria,sans-serif;font-weight:400;font-size:clamp(32px,4.2vw,52px);line-height:1.02}
.sub{color:var(--mute);margin:0 0 18px;max-width:80ch}
.foot{margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
/* cover */
.cover{background:radial-gradient(120% 90% at 100% 0%,#009eff 0%,#002aad 45%,#010126 100%);color:#fff;overflow:hidden}
.cover .logo{height:40px;color:#fff}
.cover .kick{margin:auto 0 0;font-size:14px;opacity:.8}
.cover .big{font-size:clamp(70px,13vw,170px);line-height:.9;margin:6px 0 4px}
[lang=ar] .cover .big{font-family:"FalakLatin",Alexandria,sans-serif;font-weight:300;letter-spacing:0}[lang=ar] .cover .yr{margin-top:14px;font-family:"FalakLatin",Alexandria,sans-serif;font-style:normal;font-weight:300;font-size:clamp(28px,4.4vw,56px)}
.cover .yr{font-style:italic;opacity:.78;font-size:clamp(46px,8vw,110px);line-height:.9}
.cover h1{font-size:clamp(22px,2.6vw,32px);font-weight:600;margin:24px 0 8px;max-width:30ch}
.cover p{max-width:66ch;opacity:.85;margin:0}
.cover .rule{height:1px;background:#ffffff40;margin:26px 0 14px}
.cover .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;opacity:.85}
.cover .orb{position:absolute;inset-inline-end:-10%;top:-20%;width:60%;aspect-ratio:1;border-radius:50%;border:1px solid #ffffff22;pointer-events:none}
.cover .orb.b{inset-inline-end:-2%;top:-6%;width:38%}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.t{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:0 10px 24px -20px #01012666}
.t .cap{font-size:11px;color:var(--mute);margin:0 0 6px;line-height:1.4}
.t .num{font-size:clamp(40px,4.6vw,58px);line-height:1;color:var(--ink);display:block;direction:ltr;text-align:start}
[dir=rtl] .t .num{text-align:right}
.t .d{font-size:12px;color:var(--mute);margin-top:6px;display:block}
.t.solid{background:var(--blue2);border-color:transparent;color:#fff}.t.solid .num,.t.solid .cap,.t.solid .d{color:#fff}.t.solid .cap,.t.solid .d{opacity:.82}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.h3{font-size:13px;color:var(--mute);margin:18px 0 8px}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{display:block;text-decoration:none;color:inherit;background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:12px}
.mini b{display:block;font-size:13px;margin-bottom:4px}.mini span{font-size:11.5px;color:var(--mute);display:block;line-height:1.45}
.mini i{font-style:normal;font-size:11px;font-weight:600;color:var(--bad);display:block;margin-top:6px}
@media(max-width:980px){.minis{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.minis{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* tender slide */
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.box{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:16px}
.box h4{margin:0 0 8px;font-size:13px;color:var(--mute);font-weight:600}
.box p.n{font-size:12.5px;color:var(--mute);margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border:0}
td.w{text-align:end;white-space:nowrap;color:var(--acc);font-weight:600}
td.w .num{font-size:22px;color:var(--ink)}
.main{background:var(--blue2);color:#fff;border-radius:14px;padding:16px 18px;font-weight:600;font-size:15.5px;line-height:1.5}
.main small{display:block;font-weight:400;opacity:.75;font-size:11px;margin-bottom:4px}
.rs{display:grid;gap:10px;margin-top:10px}
.r{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.r b{display:block;font-size:14px;margin-bottom:2px}.r p{margin:0;font-size:13px;color:var(--mute)}
.meta2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin-bottom:14px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.win{margin-top:14px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:860px){.win{grid-template-columns:1fr}}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:4px 10px;align-items:center;font-size:12.5px}
.hb .bar{grid-column:1/-1;height:8px;border-radius:5px;background:var(--sky);overflow:hidden;margin-bottom:6px}.hb .bar i{display:block;height:100%;background:var(--blue2);border-radius:5px}

function evaluate(){const u=U[L],R=[];let s1='pass';
 C.mand.forEach((it,i)=>{const v=CK.mand[i],t=it[L];
  if(v=='no'){s1='nogo';R.push(['bad',u.r.no+t])}
  else if(v=='partly'){if(s1!='nogo')s1='hold';R.push(['warn',u.r.partly+t])}
  else if(v=='unknown'){if(s1!='nogo')s1='hold';R.push(['warn',u.r.unknown+t+(CK.just[i]?' ('+CK.just[i]+')':'')])}
  else if(v=='na'&&!CK.just[i].trim()){if(s1!='nogo')s1='hold';R.push(['warn',u.r.na+t])}});
 const tw=CK.w.reduce((a,b)=>a+(+b||0),0);const sc=tw?Math.round(C.strat.reduce((a,it,i)=>a+(+CK.w[i]||0)*CK.strat[i],0)/(5*tw)*100):0;
 C.strat.map((it,i)=>[i,CK.strat[i]]).filter(x=>x[1]<=2).sort((a,b)=>(+CK.w[b[0]]||0)-(+CK.w[a[0]]||0)).forEach(x=>R.push(['warn',u.r.low+C.strat[x[0]][L]+' ('+x[1]+'/5)']));
 let band=sc>=75?'GO':sc>=60?'COND':sc>=45?'HOLD':'NOGO';
 const qa=CK.qa===''||CK.qa==null?null:+CK.qa,pass=+CK.pass||0,mg=+CK.margin||0;
 if(qa!=null){if(qa<pass){band=band=='NOGO'?'NOGO':'HOLD';R.push(['bad',`${u.r.qa1} (${qa} < ${pass})`])}else if(qa<pass+mg&&band=='GO'){band='COND';R.push(['warn',`${u.r.qa2} (${qa} < ${pass+mg})`])}}
 let dec=s1=='nogo'?'NOGO':s1=='hold'?(band=='NOGO'?'NOGO':'HOLD'):band;
 return {s1,sc,dec,R}}

function countUp(el){const raw=el.dataset.n;const m=raw.match(/[\d,]+(\.\d+)?/);if(!m||RM||PRINT)return;const target=parseFloat(m[0].replace(/,/g,''));const dec=(m[1]||'').length?m[1].length-1:0;const comma=m[0].includes(',');const pre=raw.slice(0,m.index),post=raw.slice(m.index+m[0].length);const t0=performance.now(),dur=900;
 const f=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);let v=(target*e).toFixed(dec);if(comma)v=Number(v).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});el.textContent=pre+v+post;if(k<1)requestAnimationFrame(f);else el.textContent=raw};requestAnimationFrame(f)}
let io;
function observe(){if(io)io.disconnect();io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const s=e.target;if(s.dataset.seen)return;s.dataset.seen=1;s.querySelectorAll('.num[data-n]').forEach(countUp);s.querySelectorAll('[data-h]').forEach(i=>i.style.height=i.dataset.h+'%');s.querySelectorAll('i[data-w]').forEach(i=>i.style.width=i.dataset.w+'%')})},{threshold:.2});document.querySelectorAll('.slide').forEach(s=>io.observe(s))}
/* pager */
let slides=[],cur=0;
function updPager(){slides=[...document.querySelectorAll('.slide')];const mid=innerHeight*.4;let c=0;slides.forEach((s,i)=>{if(s.getBoundingClientRect().top<=mid)c=i});cur=c;const pi=partOf(slides[c]&&slides[c].id);$('pc').innerHTML=`${pi>=0?`<em>${U[L].parts[pi]}</em>`:''}<b>${String(c+1).padStart(2,'0')}</b> / ${String(slides.length).padStart(2,'0')}`;document.querySelectorAll('#nav a[data-p]').forEach(a=>a.classList.toggle('on',+a.dataset.p==pi));$('pv').disabled=c==0;$('nx').disabled=c==slides.length-1;const h=document.documentElement;$('prog').style.width=(scrollY/Math.max(1,h.scrollHeight-innerHeight)*100)+'%'}
const go=d=>{const i=Math.max(0,Math.min(slides.length-1,cur+d));slides[i].scrollIntoView({behavior:RM?'auto':'smooth'})};
$('pv').addEventListener('click',()=>go(-1));$('nx').addEventListener('click',()=>go(1));
addEventListener('scroll',()=>{updPager();$('pop').hidden=true},{passive:true});addEventListener('resize',updPager);
const pres=on=>{const r=document.documentElement;r.classList.toggle('pres',on);$('pres').setAttribute('aria-pressed',String(on));if(on){try{r.requestFullscreen&&r.requestFullscreen().catch(()=>{})}catch(e){}}else{try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}setTimeout(()=>{slides[cur]&&slides[cur].scrollIntoView();updPager()},120)};
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;if(e.key=='Escape'){closeMenu();$('dlm').hidden=true;$('pop').hidden=true;if(document.documentElement.classList.contains('pres'))pres(false);return}if(e.key=='PageDown'||e.key=='j'||(e.key==' '&&document.documentElement.classList.contains('pres'))){e.preventDefault();go(1)}else if(e.key=='PageUp'||e.key=='k'){e.preventDefault();go(-1)}else if(e.key=='ArrowLeft'||e.key=='ArrowRight'){if(e.target.closest('.seg'))return;e.preventDefault();const fwd=(e.key=='ArrowLeft')==(L=='ar');go(fwd?1:-1)}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.documentElement.classList.contains('pres'))pres(false)});
/* menu / toc drawer */
function openMenu(){$('drawer').hidden=false;$('menu').setAttribute('aria-expanded','true');const a=$('drawer').querySelector('a');a&&a.focus()}
function closeMenu(){if($('drawer').hidden)return;$('drawer').hidden=true;$('menu').setAttribute('aria-expanded','false')}
$('menu').addEventListener('click',()=>$('drawer').hidden?openMenu():closeMenu());
$('drawer').addEventListener('click',e=>{if(e.target.closest('a')||e.target==$('drawer'))closeMenu()});
$('pres').addEventListener('click',()=>pres(!document.documentElement.classList.contains('pres')));
const PDF={en:'pdf/BD-Report-EN.pdf',ar:'pdf/BD-Report-AR.pdf'};
function dlMenu(){const u=U[L];const m=$('dlm');m.innerHTML=`<p class="nt" style="margin:0 0 6px">${u.dlNote}</p>${(L=='ar'?['ar','en']:['en','ar']).map(k=>`<a href="${PDF[k]}" download="Falak-2027-BD-Growth-Strategy-${k.toUpperCase()}.pdf" data-pdf="${k}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>${k=='en'?u.dlEN:u.dlAR}</a>`).join('')}<button type="button" id="dlpr"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg>${u.dlPr}</button>`}
$('dl').addEventListener('click',e=>{e.stopPropagation();const m=$('dlm');if(m.hidden){dlMenu();m.hidden=false;$('dl').setAttribute('aria-expanded','true')}else{m.hidden=true;$('dl').setAttribute('aria-expanded','false')}});
$('dlm').addEventListener('click',e=>{const a=e.target.closest('a[data-pdf]');if(a&&window.claude){e.preventDefault();const k=a.dataset.pdf;toast(U[L].dlWait);
  fetch(PDF[k]).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>DLNS?DLNS.save({filename:`Falak-2027-BD-Growth-Strategy-${k.toUpperCase()}.pdf`,data:b}).then(()=>toast(U[L].saved),()=>{}):window.open(PDF[k],'_blank')).catch(()=>window.open(PDF[k],'_blank'))}
 if(e.target.closest('#dlpr')){toast(U[L].dlHint);setTimeout(()=>{try{window.print()}catch(x){}},300)}
 $('dlm').hidden=true});
document.addEventListener('click',e=>{if(!e.target.closest('#dlm,#dl'))$('dlm').hidden=true;if(!e.target.closest('#pop,.sref'))$('pop').hidden=true});
/* delegated events */
let DLNS=null;try{window.claude&&window.claude.use&&window.claude.use('downloads').then(d=>{DLNS=d}).catch(()=>{})}catch(e){}
function copyTxt(t){try{navigator.clipboard.writeText(t).then(()=>toast(U[L].copied),()=>toast(U[L].copied))}catch(x){}}
const deck=$('deck');
deck.addEventListener('click',e=>{
 const sr=e.target.closest('.sref');if(sr){e.preventDefault();const id=sr.getAttribute('href').slice(5),s=D.src[SRCI[id]-1],u=U[L],pp=$('pop');pp.innerHTML=`<span class="ty ${s[6]}">${u.typ[s[6]]}</span><b>${esc(s[LI(L)+1])}</b><small>${u.srcH[2]}: ${esc(s[3])} · ${u.srcH[3]}: ${esc(s[5])}</small><div>${s[4]?`<a href="${esc(s[4])}" target="_blank" rel="noopener">${u.open} ↗</a>`:''}<a href="#src-${id}" class="pa">${u.allSrc}</a></div>`;pp.hidden=false;const r=sr.getBoundingClientRect(),w=Math.min(300,innerWidth-20);pp.style.width=w+'px';pp.style.left=Math.max(10,Math.min(innerWidth-w-10,r.left-w/2))+'px';pp.style.top=(r.bottom+8+(r.bottom+170>innerHeight?-180:0))+'px';return}
 const vb=e.target.closest('.vb');if(vb){document.querySelectorAll('.vb').forEach(b=>b.setAttribute('aria-pressed',String(b==vb)));const c=vb.dataset.v=='cmp';$('cmp').hidden=!c;document.querySelector('#glance .minis').hidden=c;return}
 const vk=e.target.closest('.venn [data-k],.pc2');if(vk){selPos(vk.dataset.k||vk.getAttribute('data-k'));return}
 const pl=e.target.closest('.pl');if(pl){$('growth').scrollIntoView({behavior:RM?'auto':'smooth'});const b=document.querySelector(`.pt[data-i="${pl.dataset.i}"]`);b&&b.click();return}
 const ef=e.target.closest('.ef');if(ef){document.querySelectorAll('.ef').forEach(b=>b.setAttribute('aria-pressed',String(b==ef)));const p=ef.dataset.p;document.querySelectorAll('.ex:not(.sumc)').forEach(x=>x.classList.toggle('dim',p!='-1'&&x.dataset.p!=p));return}
 const pt=e.target.closest('.pt');if(pt){const x=D.exp.lines[+pt.dataset.i];document.querySelectorAll('.pt').forEach(b=>b.classList.toggle('on',b==pt));$('mdet').innerHTML=`<b>${+pt.dataset.i+1} · ${esc(x[L][0])}</b><span>${esc(x[L][1])}</span><span class="mm">${U[L].need}: ${esc(x[L][2])} · ${U[L].when}: ${esc(x[L][3])}</span>`;return}
 const fc=e.target.closest('.fc:not(.ef)');if(fc){document.querySelectorAll('.fc:not(.ef)').forEach(b=>b.setAttribute('aria-pressed',String(b==fc)));const f=fc.dataset.f;document.querySelectorAll('.mini').forEach(m=>m.classList.toggle('dim',f!='all'&&m.dataset.k!=f));return}
 const rw=e.target.closest('.rw');if(rw){const mx=$('mx'),i=rw.dataset.r,on=mx.dataset.f==i;mx.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));if(on){mx.classList.remove('focus');delete mx.dataset.f}else{mx.classList.add('focus');mx.dataset.f=i;mx.querySelectorAll(`[data-r="${i}"]`).forEach(x=>x.classList.add('on'))}return}
 const st=e.target.closest('.st');if(st){document.querySelectorAll('.st').forEach(b=>{b.classList.toggle('on',b==st);b.setAttribute('aria-pressed',String(b==st))});$('sdet').textContent=D.system[L][+st.dataset.i][2];return}
 const sq=e.target.closest('.seg button[data-q]');if(sq){CK.mand[+sq.dataset.q]=sq.dataset.v;score();return}
 const ss=e.target.closest('.seg button[data-s]');if(ss){CK.strat[+ss.dataset.s]=+ss.dataset.v;score();return}
 if(e.target.closest('#ckex')){CK=ckExample();rerenderCk();return}
 if(e.target.closest('#ckre')){CK=ckDefault();rerenderCk();return}
 if(e.target.closest('#ckpr')){document.documentElement.classList.add('print-ck');setTimeout(()=>{try{window.print()}catch(x){}document.documentElement.classList.remove('print-ck')},50);return}
 if(e.target.closest('#ckxp')){const txt=ckText();const nm=(CK.meta.name||'tender').replace(/[^\w؀-ۿ -]+/g,'').trim().replace(/\s+/g,'-')||'tender';
  const fn=`readiness-${nm}.txt`;
  if(DLNS){DLNS.save({filename:fn,data:txt}).then(()=>toast(U[L].saved),()=>{copyTxt(txt)});return}
  if(window.claude){copyTxt(txt);return}
  try{const b=new Blob([txt],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast(U[L].saved)}catch(x){copyTxt(txt)}return}
});
function rerenderCk(){const old=$('checker');const tmp=document.createElement('div');const keep=pg;pg=[...document.querySelectorAll('.slide')].indexOf(old);tmp.innerHTML=checker();pg=keep;const n=tmp.firstElementChild;n.dataset.seen=1;const pi=partOf('checker');n.querySelector('.lbl').insertAdjacentHTML('afterbegin',`<span class="ptag">${U[L].part} ${pi+1} · ${U[L].parts[pi]}</span>`);old.replaceWith(n);score();updPager()}
deck.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.m){CK.meta[t.dataset.m]=t.value;store.set('bd-ck2',CK);return}
 if(t.dataset.j!=null){CK.just[+t.dataset.j]=t.value;score();return}
 if(t.dataset.w!=null&&t.classList.contains('wt')){CK.w[+t.dataset.w]=Math.max(0,+t.value||0);score();return}
 if(t.dataset.g){CK[t.dataset.g]=t.dataset.g=='qa'?(t.value===''?'':+t.value):(+t.value||0);score();return}});
deck.addEventListener('change',e=>{const c=e.target.closest('input[type=checkbox][data-k]');if(c){PL[c.dataset.k]=c.checked;store.set('bd-plan',PL);planProg()}});
deck.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.matches('.rw,.vd')){e.preventDefault();if(e.target.matches('.vd'))selPos(e.target.dataset.k);else e.target.click()}});
deck.addEventListener('mouseover',e=>{const c=e.target.closest('.mx [data-c]');document.querySelectorAll('.mx .hl').forEach(x=>x.classList.remove('hl'));if(!c)return;const mx=$('mx');mx.querySelectorAll(`[data-c="${c.dataset.c}"]`).forEach(x=>x.classList.add('hl'));if(c.dataset.r)mx.querySelectorAll(`[data-r="${c.dataset.r}"]`).forEach(x=>x.classList.add('hl'))});
function render(){pg=0;const de=document.documentElement;de.lang=L;de.dir=L=='ar'?'rtl':'ltr';document.title=L=='ar'?'فلك 2027 | استراتيجية تطوير الأعمال والنمو':'Falak 2027 | Business Development & Growth Strategy';
 const u=U[L];$('lang').textContent=u.lang;$('menu').setAttribute('aria-label',u.menu);$('menu').title=u.toc;$('pres').title=$('pres').ariaLabel=u.pres;$('dl').title=$('dl').ariaLabel=u.dl;$('dlt').textContent=u.dl;
 $('conf').textContent=D.conf[L];
 $('nav').innerHTML=`<a href="#contents">${u.toc}</a>`+PARTS.map((p,i)=>`<a href="#${p[0]}" data-p="${i}">${u.parts[i]}</a>`).join('');
 $('drawer').innerHTML=`<div class="dp" role="dialog" aria-label="${u.toc}"><p class="lbl"><b>${u.toc}</b></p>${PARTS.map((p,i)=>`<a href="#${p[0]}" class="dpp"><span>${String(i+1).padStart(2,'0')}</span>${u.parts[i]}</a>`+p[1].filter(id=>id!=p[0]).map(id=>`<a href="#${id}" class="dps">${esc(slideName(id))}</a>`).join('')).join('')}</div>`;
 deck.innerHTML=cover()+contents()+glance()+D.projects.map(tender).join('')+patterns()+problems()+system()+checker()+macro()+finance()+riyadh()+consult()+positioning()+opps()+plan()+sources();
 document.querySelectorAll('.slide').forEach(sl=>{const i=partOf(sl.id),l=sl.querySelector('.lbl');if(i>=0&&l)l.insertAdjacentHTML('afterbegin',`<span class="ptag">${u.part} ${i+1} · ${u.parts[i]}</span>`)});
 score();planProg();observe();updPager();
 if(location.hash){const el=$(location.hash.slice(1));if(el)el.scrollIntoView()}}

const isDark=()=>{const r=document.documentElement;if(r.classList.contains('m-light'))return false;if(r.classList.contains('m-dark'))return true;if(r.dataset.theme)return r.dataset.theme=='dark';return matchMedia('(prefers-color-scheme: dark)').matches};
